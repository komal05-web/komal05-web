name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: komal05-web
          outputs: |
           dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%237DF9FF&color_dots=%230D1117,%23291B4A,%23583A8C,%23B36BFF,%23FF6EC7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
